name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uvx ruff check src

      - name: Compile check
        run: uv run python -m compileall -q src

      - name: Dependency audit
        run: uvx pip-audit

      - name: Build package
        run: uv build
